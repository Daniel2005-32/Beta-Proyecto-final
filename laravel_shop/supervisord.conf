[supervisord]
nodaemon=true
user=root
loglevel=info

[program:php-fpm]
command=php-fpm -R
autostart=true
autorestart=true

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true

[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8090
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=3 --max-time=3600
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
